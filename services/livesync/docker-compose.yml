networks:
  web:
    external: true

services:
  database:
    image: couchdb:3
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${LIVESYNC_DATABASE_USER}
      - COUCHDB_PASSWORD=${LIVESYNC_DATABASE_PASSWORD}
    volumes:
      - ${DATA_DIR}/livesync:/opt/couchdb/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.couchdb.rule=Host(`couchdb.slink7.dev`)"
      - "traefik.http.routers.couchdb.entrypoints=websecure"
      - "traefik.http.routers.couchdb.tls.certresolver=letsencrypt"
      - "traefik.http.services.couchdb.loadbalancer.server.port=5984"
    networks:
      - web
